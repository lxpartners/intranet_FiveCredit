site_name: Five Credit — Intranet
site_description: Plataforma interna Five Credit — procedimentos, fluxos e comunicação
docs_dir: docs

theme:
  name: material
  language: pt
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Ativar modo claro
  font:
    text: Inter
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.integrate
    - search.suggest
    - content.code.copy
    - content.print.button

plugins:
  - search
  - blog:
      blog_dir: comunicados
      blog_toc: true
      post_date_format: long
      pagination_per_page: 10
      categories: false
      archive: false
  - git-revision-date-localized:
      type: date
      locale: pt
      fallback_to_build_date: true

nav:
  - Início:
      - Visão geral: index.md
      - Como Usar / Pedir Ajuda: geral/ajuda.md
      - Perguntas Frequentes: geral/faq.md
  - Geral:
      - Comunicados e Novidades: comunicados/index.md
      - Book de Comunicação:
          - Registo: book-comunicacao/registo.md
          - Candidatura: book-comunicacao/candidatura.md
          - Contabilista: book-comunicacao/contabilista.md
          - KYC: book-comunicacao/kyc.md
          - Contrato: book-comunicacao/contrato.md
          - Manutenção: book-comunicacao/manutencao.md
          - Procedimentos: book-comunicacao/procedimentos.md
      - Fluxo de Trabalho:
          - "Fase 1 — Registo": fluxo-trabalho/fase-1-registo.md
          - "Fase 2 — Candidatura": fluxo-trabalho/fase-2-candidatura.md
          - "Fase 3 — Documentos": fluxo-trabalho/fase-3-documentos.md
          - "Fase 4 — Avaliação": fluxo-trabalho/fase-4-avaliacao.md
          - "Fase 5 — KYC & RCBE": fluxo-trabalho/fase-5-kyc-rcbe.md
          - "Fase 6 — Formalização": fluxo-trabalho/fase-6-formalizacao.md
      - Segurança da Informação: seguranca/seguranca-informacao.md
      - Glossário: geral/glossario.md
      - Prazos e Obrigações Recorrentes: geral/prazos-obrigacoes.md
      - Equipa e Organograma: equipa/organograma.md
  - Comercial:
      - Procedimentos: comercial/originacao-credito.md
  - Risco:
      - Procedimentos: risco/analise-decisao-risco.md
  - Compliance:
      - Política de Compliance:
          - Visão geral: compliance/index.md
          - "01 — Introdução": compliance/01-introducao.md
          - "02 — Função de Compliance": compliance/02-funcao-compliance.md
          - "03 — Princípios": compliance/03-principios.md
          - "04 — Responsável": compliance/04-responsavel.md
          - "05 — Relatórios": compliance/05-relatorios.md
          - "06 — Manutenção de Registos": compliance/06-manutencao-registos.md
          - "07 — Gestão de Visitas": compliance/07-gestao-visitas.md
          - "Apêndice 1 — Recibo": compliance/apendice-1.md
      - Proteção de Dados (RGPD):
          - Visão geral: rgpd/index.md
          - "01 — Introdução": rgpd/01-introducao.md
          - "02 — Responsável pelo Tratamento": rgpd/02-responsavel.md
          - "03 — Contactos do DPO": rgpd/03-contactos.md
          - "04 — Tratamento de Dados": rgpd/04-tratamento.md
          - "05 — Finalidades e Prazos": rgpd/05-finalidades-prazos.md
          - "06 — Comunicação de Dados": rgpd/06-comunicacao.md
          - "07 — Direitos do Titular": rgpd/07-direitos-titular.md
          - "08 — Segurança dos Dados": rgpd/08-seguranca.md
          - "09 — Cookies": rgpd/09-cookies.md
          - "10 — Anexos": rgpd/10-anexos.md
          - "11 — Aprovação": rgpd/11-aprovacao.md
      - Política de ESG:
          - Visão geral: esg/index.md
          - "01 — Introdução": esg/01-introducao.md
          - "02 — Objeto": esg/02-objeto.md
          - "03 — Estratégia de Sustentabilidade": esg/03-estrategia.md
          - "04 — Princípios Gerais": esg/04-principios.md
          - "05 — Impacto na Política de Investimentos": esg/05-impacto-investimentos.md
          - "06 — Impacto na Governação": esg/06-governacao.md
          - "07 — Impacto na Gestão de Riscos": esg/07-gestao-riscos.md
          - "08 — Impacto na Política de Remuneração": esg/08-remuneracao.md
          - "09 — Aprovação e Entrada em Vigor": esg/09-aprovacao.md
      - Livro de Reclamações: reclamacoes/livro-reclamacoes.md
      - Continuidade de Negócio: compliance/continuidade-negocio.md
      - Gestão de Incumprimentos: compliance/gestao-incumprimentos.md
      - Scoring do Avalista: compliance/scoring-avalista.md
      - Parceiros: compliance/parceiros.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
